name: lint

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Update trusted CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          dpkg-query -W ca-certificates
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          . /etc/os-release
          case "$VERSION_ID" in
            24.04) minimum=20260816ubuntu0.24.04.1 ;;
            26.04) minimum=20260816ubuntu0.26.04.1 ;;
            *) echo "Unverified Ubuntu version: $VERSION_ID"; exit 1 ;;
          esac
          dpkg --compare-versions "$installed" ge "$minimum"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5
        with:
          go-version: '1.27.3'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9
        with:
          version: v2.15.0
          install-mode: goinstall

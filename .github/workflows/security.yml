name: security

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/security.yml'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'helper/**'
      - 'internal/**'
      - 'main.go'
      - 'scripts/**'
      - 'service/**'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Update trusted CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          dpkg-query -W ca-certificates
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          dpkg --compare-versions "$installed" ge 20260816ubuntu0.24.04.1

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5
        with:
          go-version: '1.27.3'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run vulnerability scan
        run: govulncheck ./...

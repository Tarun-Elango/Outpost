name: security

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/security.yml'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - 'helper/**'
      - 'internal/**'
      - 'main.go'
      - 'scripts/**'
      - 'service/**'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - name: Update trusted CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          dpkg-query -W ca-certificates
          installed=$(dpkg-query -W -f='${Version}' ca-certificates)
          . /etc/os-release
          case "$VERSION_ID" in
            24.04) minimum=20260816ubuntu0.24.04.1 ;;
            26.04) minimum=20260816ubuntu0.26.04.1 ;;
            *) echo "Unverified Ubuntu version: $VERSION_ID"; exit 1 ;;
          esac
          dpkg --compare-versions "$installed" ge "$minimum"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.27.3'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run vulnerability scan
        run: govulncheck ./...
